name: C++ style checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  google-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: python3 tests/test_cpp_style.py
      - run: python3 scripts/check_cpp_style.py --format-only
  strict-policy-screen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: python3 scripts/check_cpp_style.py --report results/raw/cpp-style.json
      - name: Retain strict style findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-style-report
          path: results/raw/cpp-style.json
          if-no-files-found: warn
