<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="388" viewBox="0 0 1200 388"
     role="img" aria-labelledby="title description">
  <title id="title">KVHarbor serving architecture</title>
  <desc id="description">HTTP requests enter separate generation, transcription, and synthesis queues.
    Typed runtime adapters call llama.cpp or TensorRT Edge-LLM for text, and sherpa-onnx for speech.
    The service returns streamed text deltas, a JSON transcript, or PCM16 audio.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9"
            refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 1.5 8 5 2 8.5" fill="none" stroke="#8DA4B9" stroke-width="1.75"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g fill="#151F2A" stroke="#334354" stroke-width="1.5">
    <rect x="215" y="20" width="190" height="348" rx="28"/>
    <rect x="443" y="20" width="214" height="348" rx="28"/>
    <rect x="695" y="20" width="271" height="348" rx="28"/>
    <rect x="1004" y="20" width="176" height="348" rx="28"/>
  </g>

  <g fill="none" stroke="#8DA4B9" stroke-width="1.8" stroke-linecap="round"
     stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M182 211 C202 211 192 116 226 116"/>
    <path d="M182 211 H226"/>
    <path d="M182 211 C202 211 192 306 226 306"/>
    <path d="M388 116 H454"/>
    <path d="M640 116 H706"/>
    <path d="M949 116 H1015"/>
    <path d="M388 211 H454"/>
    <path d="M640 211 H706"/>
    <path d="M949 211 H1015"/>
    <path d="M388 306 H454"/>
    <path d="M640 306 H706"/>
    <path d="M949 306 H1015"/>
  </g>

  <g fill="#202C39" stroke="#4B6073" stroke-width="1.5">
    <rect x="20" y="173" width="162" height="76" rx="22"/>
    <rect x="232" y="84" width="156" height="64" rx="19"/>
    <rect x="460" y="84" width="180" height="64" rx="19"/>
    <rect x="1021" y="84" width="142" height="64" rx="19"/>
    <rect x="232" y="179" width="156" height="64" rx="19"/>
    <rect x="460" y="179" width="180" height="64" rx="19"/>
    <rect x="712" y="179" width="237" height="64" rx="19"/>
    <rect x="1021" y="179" width="142" height="64" rx="19"/>
    <rect x="232" y="274" width="156" height="64" rx="19"/>
    <rect x="460" y="274" width="180" height="64" rx="19"/>
    <rect x="712" y="274" width="237" height="64" rx="19"/>
    <rect x="1021" y="274" width="142" height="64" rx="19"/>
  </g>
  <rect x="712" y="76" width="237" height="80" rx="19"
        fill="#203547" stroke="#55758E" stroke-width="1.5"/>

  <g font-family="Inter, 'Segoe UI', 'DejaVu Sans', sans-serif" text-anchor="middle">
    <g fill="#AEBDCC" font-size="17" font-weight="600">
      <text x="310" y="53">Task queues</text>
      <text x="550" y="53">Runtime adapters</text>
      <text x="830" y="53">Engines</text>
      <text x="1092" y="53">Responses</text>
    </g>
    <text x="101" y="208" fill="#EDF3F8" font-size="18" font-weight="600">HTTP ingress</text>
    <text x="101" y="229" fill="#AEBDCC" font-size="15">Asio / Beast</text>
    <text x="310" y="122" fill="#EDF3F8" font-size="17" font-weight="600">Generation</text>
    <text x="550" y="114" fill="#EDF3F8" font-size="18" font-weight="600">Text</text>
    <text x="550" y="135" fill="#AEBDCC" font-size="15">typed request</text>
    <text x="1092" y="114" fill="#EDF3F8" font-size="18" font-weight="600">SSE</text>
    <text x="1092" y="135" fill="#AEBDCC" font-size="15">text deltas</text>
    <text x="831" y="101" fill="#EDF3F8" font-size="18" font-weight="600">llama.cpp</text>
    <text x="831" y="123" fill="#EDF3F8" font-size="18" font-weight="600">TensorRT Edge-LLM</text>
    <text x="831" y="143" fill="#AEBDCC" font-size="14">GPU · select one</text>
    <text x="310" y="217" fill="#EDF3F8" font-size="17" font-weight="600">Transcription</text>
    <text x="550" y="209" fill="#EDF3F8" font-size="18" font-weight="600">ASR</text>
    <text x="550" y="230" fill="#AEBDCC" font-size="15">WAV input</text>
    <text x="1092" y="209" fill="#EDF3F8" font-size="18" font-weight="600">JSON</text>
    <text x="1092" y="230" fill="#AEBDCC" font-size="15">transcript</text>
    <text x="831" y="209" fill="#EDF3F8" font-size="18" font-weight="600">sherpa-onnx</text>
    <text x="831" y="230" fill="#AEBDCC" font-size="15">Qwen3-ASR · CPU</text>
    <text x="310" y="312" fill="#EDF3F8" font-size="17" font-weight="600">Synthesis</text>
    <text x="550" y="304" fill="#EDF3F8" font-size="18" font-weight="600">TTS</text>
    <text x="550" y="325" fill="#AEBDCC" font-size="15">text and voice</text>
    <text x="1092" y="304" fill="#EDF3F8" font-size="18" font-weight="600">PCM16</text>
    <text x="1092" y="325" fill="#AEBDCC" font-size="15">audio chunks</text>
    <text x="831" y="304" fill="#EDF3F8" font-size="18" font-weight="600">sherpa-onnx</text>
    <text x="831" y="325" fill="#AEBDCC" font-size="15">Kokoro · CPU</text>
  </g>
</svg>
