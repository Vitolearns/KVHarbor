<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520"
     xml:lang="zh-CN" role="img" aria-labelledby="diagram-title diagram-description" font-family="system-ui, -apple-system, Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <title id="diagram-title">KVHarbor 服务架构</title>
  <desc id="diagram-description">C++20 HTTP 服务把请求分到各自的任务队列和工作线程。文本生成在启动时选择一个 GPU 后端，返回 SSE 文本流。CPU 语音识别返回 JSON，CPU 语音合成返回 PCM16 音频流。</desc>
  <rect x=".5" y=".5" width="719" height="519" rx="24" fill="#141f24" stroke="#3d555b"/>
  <path d="M24 1H696a23 23 0 0 1 23 23v107H1V24A23 23 0 0 1 24 1Z" fill="#203a39"/>
  <rect x="27" y="37" width="57" height="57" rx="15" fill="#2e5350"/>
  <path d="M40 65h9m0 0v-10q0-4 4-4h16M49 65h20M49 65v10q0 4 4 4h16
           M65 47l4 4-4 4m0 6 4 4-4 4m0 6 4 4-4 4"
        fill="none" stroke="#b2f3dd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="101" y="63" fill="#f1faf7" font-size="37" font-weight="750" letter-spacing="-.9">KVHarbor</text>
  <text x="103" y="91" fill="#bbe6dc" font-size="21" font-weight="550">HTTP 接口 · C++20</text>
  <path d="M365 38v56" fill="none" stroke="#6a918b"/>
  <g fill="#f1faf7" font-size="21" font-weight="550">
    <text x="393" y="59">请求准入 · 截止时间</text>
    <text x="393" y="86">请求取消 · 输出背压</text>
  </g>

  <g fill="#b0c6c4" font-size="19" font-weight="650">
    <text x="84" y="176">队列与工作线程</text>
    <text x="296" y="176">推理后端</text>
    <text x="557" y="176">HTTP 响应</text>
  </g>
  <rect x="67" y="200" width="628" height="127" rx="15" fill="#233b36" stroke="#456f63"/>
  <rect x="67" y="341" width="628" height="70" rx="15" fill="#1c2c33" stroke="#3b5259"/>
  <rect x="67" y="425" width="628" height="70" rx="15" fill="#1c2c33" stroke="#3b5259"/>
  <g fill="none" stroke="#86b5ac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M35 133v315"/>
    <path d="M35 252q0 12 12 12h17m-5-5 5 5-5 5 M255 264h23m-5-5 5 5-5 5 M517 264h23m-5-5 5 5-5 5"/>
    <path d="M35 364q0 12 12 12h17m-5-5 5 5-5 5 M255 376h23m-5-5 5 5-5 5 M517 376h23m-5-5 5 5-5 5"/>
    <path d="M35 448q0 12 12 12h17m-5-5 5 5-5 5 M255 460h23m-5-5 5 5-5 5 M517 460h23m-5-5 5 5-5 5"/>
  </g>
  <circle cx="35" cy="131" r="4.5" fill="#86b5ac"/>

  <g fill="#e8f3f0" font-size="23" font-weight="680">
    <text x="84" y="272">文本生成</text>
    <text x="84" y="384">语音识别</text>
    <text x="84" y="468">语音合成</text>
  </g>
  <text x="296" y="226" fill="#a9ead1" font-size="18" font-weight="650">GPU · 启动时二选一</text>
  <path d="M288 264h9m0-9h11m-11 0v40h11" fill="none" stroke="#86b5ac" stroke-width="1.5" stroke-linecap="round"/>
  <g fill="#e8f3f0" font-size="21" font-weight="680">
    <text x="319" y="262">llama.cpp</text>
    <text x="319" y="302">TensorRT Edge-LLM</text>
    <text x="296" y="369">Qwen3-ASR</text>
    <text x="296" y="453">Kokoro</text>
  </g>
  <g fill="#b0c6c4" font-size="18">
    <text x="296" y="393">sherpa-onnx · CPU</text>
    <text x="296" y="477">sherpa-onnx · CPU</text>
    <text x="557" y="288">文本流</text>
    <text x="557" y="393">转写结果</text>
    <text x="557" y="477">音频流</text>
  </g>
  <g fill="#a9ead1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="700">
    <text x="557" y="264">SSE</text>
    <text x="557" y="369">JSON</text>
    <text x="557" y="453">PCM16</text>
