<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 448" width="720" height="448"
     xml:lang="zh-CN" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">KVHarbor 服务架构</title>
  <desc id="diagram-description">同一个 kvharbor-server 进程经共享调度将请求分到文本生成、语音识别和语音合成队列。各运行时适配器调用选定的文本引擎或 CPU 上的 sherpa-onnx。HTTP 接口负责返回 SSE、JSON 或 PCM16。</desc>
  <style>
    text {
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      fill: #1f2328;
    }
    .panel { fill: #ffffff; stroke: #8c959f; stroke-width: 1.25; }
    .node { font-size: 17px; font-weight: 650; }
    .detail { font-size: 14px; fill: #424a53; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
    .engine { font-size: 15px; font-weight: 650; }
    .device { font-size: 12px; fill: #424a53; text-anchor: end; }
  </style>
  <defs>
    <marker id="request-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4 0 8Z" fill="#0969da"/>
    </marker>
    <marker id="response-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4 0 8Z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="720" height="448" fill="#ffffff"/>
  <rect x="12" y="66" width="696" height="370" rx="8"
        fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/>
  <text class="mono" x="28" y="89" font-size="15" font-weight="700">kvharbor-server</text>
  <text class="detail" x="692" y="89" text-anchor="end">单个 C++20 进程</text>

  <rect class="panel" x="282" y="8" width="156" height="32" rx="5"/>
  <rect class="panel" x="150" y="101" width="420" height="57" rx="5"/>
  <rect x="106" y="198" width="508" height="57" rx="5"
        fill="#eaf3ff" stroke="#0969da" stroke-width="1.25"/>
  <g text-anchor="middle">
    <text class="node" x="360" y="30">HTTP 客户端</text>
    <text class="node" x="360" y="125">HTTP 接口</text>
    <text class="detail" x="360" y="146">路由请求 · 返回 SSE、JSON 或 PCM16</text>
    <text class="node" x="360" y="222">请求准入与调度</text>
    <text class="detail" x="360" y="243">分任务有界队列 · 截止时间 · 取消 · 背压</text>
  </g>

  <rect class="panel" x="34" y="296" width="208" height="38" rx="5"/>
  <text class="node" x="138" y="321" text-anchor="middle">文本适配器</text>
  <rect class="panel" x="256" y="296" width="208" height="38" rx="5"/>
  <text class="node" x="360" y="321" text-anchor="middle">语音识别适配器</text>
  <rect class="panel" x="478" y="296" width="208" height="38" rx="5"/>
  <text class="node" x="582" y="321" text-anchor="middle">语音合成适配器</text>

  <rect class="panel" x="34" y="355" width="208" height="65" rx="5"/>
  <rect class="panel" x="256" y="355" width="208" height="65" rx="5"/>
  <rect class="panel" x="478" y="355" width="208" height="65" rx="5"/>

  <text class="detail" x="45" y="373">启动时二选一</text>
  <text class="engine" x="45" y="393">llama.cpp</text>
  <text class="engine" x="45" y="412">TensorRT Edge-LLM</text>
  <text class="engine" x="267" y="382">sherpa-onnx</text>
  <text class="detail" x="267" y="405">Qwen3-ASR</text>
  <text class="engine" x="489" y="382">sherpa-onnx</text>
  <text class="detail" x="489" y="405">Kokoro</text>
  <g class="mono device">
    <text x="231" y="393">CPU / CUDA</text>
    <text x="231" y="412">CUDA</text>
    <text x="453" y="382">CPU</text>
    <text x="675" y="382">CPU</text>
  </g>

  <g fill="none" stroke="#0969da" stroke-width="1.6" stroke-linejoin="round">
    <path d="M360 255V274M138 274H582"/>
    <g marker-end="url(#request-head)">
      <path d="M347 40V101"/>
      <path d="M347 158V198"/>
      <path d="M138 274V296"/>
      <path d="M360 274V296"/>
      <path d="M582 274V296"/>
      <path d="M138 334V355"/>
      <path d="M360 334V355"/>
      <path d="M582 334V355"/>
    </g>
  </g>
  <g fill="none" stroke="#57606a" stroke-width="1.6" stroke-dasharray="4 3"
     marker-end="url(#response-head)">
    <path d="M373 101V40"/>
    <path d="M373 198V158"/>
  </g>
  <g class="detail">
    <text x="335" y="59" text-anchor="end">HTTP 请求</text>
    <text x="385" y="59">HTTP 响应</text>
    <text x="335" y="182" text-anchor="end">类型化请求</text>
    <text x="385" y="182">结果和数据块</text>
  </g>
</svg>
